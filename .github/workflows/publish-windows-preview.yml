name: Publish tested Windows preview installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified project
        uses: actions/checkout@v4
      - name: Download previously successful Windows installer candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-assets
          gh run download 41270375811 \
            --repo "${GITHUB_REPOSITORY}" \
            --name baifan-windows-installer-candidate \
            --dir preview-assets
          ls -lh preview-assets
      - name: Verify release artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          cd preview-assets
          sha256sum --check SHA256SUMS.txt
          test -s baifan-downloader-0.10.103-setup.exe
      - name: Prepare preview release information
        shell: bash
        run: |
          cat > preview-assets/RELEASE_NOTES.md <<'ENDNOTES'
          ## 白饭下载器 0.10.103 · Windows 预览安装包

          **Windows 10/11 x64。** 下载 `baifan-downloader-0.10.103-setup.exe`，运行安装向导即可。普通用户不需要 Python 或自行编译。

          **预览版限制：** 已在 GitHub Actions Windows 环境通过构建、安装到干净目录、程序启动及本地 API 健康检查；**尚未**完成真实 BT/磁力、多站点登录下载、长期运行、Windows SmartScreen/杀毒软件和多种机型的全覆盖测试。请将其视为候选版，重要下载任务建议保留备份。

          - 基于 PySide6 + aria2；aria2 1.37.0 使用微软 winget 清单公开 SHA256 校验后打包。
          - 内含独立 aria2 二进制、其 GPL 许可证及 aria2 1.37.0 对应源码归档。
          - 保留 AI 辅助改名、外部本地 API、桌宠及背景自定义。
          - 不含尚未核实原始采样再分发授权的两段 Ciallo 混音，默认使用 ding.wav；用户可自行选择自定义音效。
          - 二进制**尚未代码签名**，Windows 可能提示“未知发布者”。请只从本仓库官方下载、核对 SHA256；勿从第三方链接下载。
          - 项目原创代码采用 PolyForm Noncommercial 1.0.0（非商业源码可见，不是 OSI 开源）；Qt/PySide6、aria2 仍保留各自许可。

          本版本软件尚无自动更新。源码可在仓库主分支查看；有问题请通过 Issues 反馈。
          ENDNOTES
      - name: Create public pre-release (not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.10.103-preview1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            preview-assets/baifan-downloader-0.10.103-setup.exe \
            preview-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "a8df8ff6a1d52bd3611c6d45a293c842fbd5138b" \
            --title "白饭下载器 v0.10.103 · Windows 预览安装包" \
            --prerelease \
            --notes-file preview-assets/RELEASE_NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
