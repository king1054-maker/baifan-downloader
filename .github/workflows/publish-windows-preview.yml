name: Publish tested Windows preview (Setup and portable)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Require completed green source integrity and Windows smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch 41872691277 --repo "$GITHUB_REPOSITORY" --interval 5 --exit-status
          gh run watch 41872691293 --repo "$GITHUB_REPOSITORY" --interval 5 --exit-status
      - name: Download previously smoke-tested Windows EXE and portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-assets
          gh run download 41872691293 \
            --repo "${GITHUB_REPOSITORY}" \
            --name baifan-windows-installer-candidate \
            --dir preview-assets
          ls -lh preview-assets
      - name: Verify BOTH release files using published SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd preview-assets
          sha256sum --check SHA256SUMS.txt
          test -s baifan-downloader-0.10.108-setup.exe
          test -s baifan-downloader-0.10.108-portable-win-x64.zip
      - name: Prepare public preview documentation
        shell: bash
        run: |
          cat > preview-assets/RELEASE_NOTES.md <<'ENDNOTES'
          ## 白饭下载器 v0.10.108 · Windows 安装与绿色版（预览版 1）

          **Windows 10/11 x64，普通用户和 AI 都不需要 Python 或编译源码。**

          - **普通用户：** 下载 `baifan-downloader-0.10.108-setup.exe`，双击进入 Windows 安装向导。
          - **AI 智能体 / 受限桌面环境：** 推荐 `baifan-downloader-0.10.108-portable-win-x64.zip`，下载后核对 `SHA256SUMS.txt`，解压并启动 `BaiFanDownloader/BaiFanDownloader.exe`，无需安装向导或注册表写入。
          - **统一 AI 安装入口：** 只需提供仓库 URL `https://github.com/king1054-maker/baifan-downloader`，AI 阅读根目录 [INSTALL.md](https://github.com/king1054-maker/baifan-downloader/blob/main/INSTALL.md) 后执行即可。根目录的 `install.ps1` 可自动发现最新发行版本、下载、校验、解压并尝试启动。

          ### 0.10.108 本次更新
          - BT / 磁力多文件任务支持在下载中重新勾选文件，500 毫秒防抖自动应用；对 aria2 返回的选中状态进行复核，并同步更新所选总大小、完成进度和预计剩余时间。
          - 任务状态变更使用工作线程处理，避免同步等待阻塞主界面；异常时尝试恢复任务原运行状态。
          - 默认下载完成提示音改为原创柔和古典风格的 complete_soft.wav，保留用户自定义设置。
          - 合并源码/测试版启动时误写开机自启的修复（PR #8）。
          - 不清空用户任务、下载记录或 session，不主动删除已有下载文件。

          ### 已验证
          - 在 GitHub Actions Windows 环境完成 EXE + Portable ZIP 构建。
          - EXE 进行安装并启动，本地 API 健康检查通过。
          - Portable ZIP 在全新目录解压、启动，API 健康检查通过。
          - 两种制品各自提供 SHA256 校验值。
          - 使用 aria2 官方 1.37.0 x64 并包含相应许可证和源码归档。

          ### 限制
          - **预览版而非稳定版**；没有完成真实 BT/磁力、多网站登录下载、Windows 多设备和长期运行验收。
          - **安装包与程序尚未代码签名**，Windows 可能提示未知发布者。
          - 某些 AI 沙箱禁止启动 Windows EXE；ZIP 解决图形安装器和注册表限制，**但不能绕过操作系统或沙箱对运行 EXE 的禁令**。这种情况下需要用户亲自启动或授权。
          - 不包含再分发授权尚未确认的 Ciallo 两段混音，使用内置提示音；不收集或上传用户的 AI API Key。
          - 应用原创代码采用 PolyForm Noncommercial 1.0.0；PySide6 / Qt、aria2 遵循各自许可证。请保留已有用户数据，避免覆盖旧安装目录。

          Build source: [Windows CI #41872691293](https://github.com/king1054-maker/baifan-downloader/actions/runs/41872691293). 
          ENDNOTES
      - name: Publish public PRE-RELEASE (never overwrite existing assets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.10.108-preview1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pre-release already exists. Do not overwrite installer users already downloaded."
            exit 0
          fi
          gh release create "$TAG" \
            preview-assets/baifan-downloader-0.10.108-setup.exe \
            preview-assets/baifan-downloader-0.10.108-portable-win-x64.zip \
            preview-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "e81b4c0276b256008cd05349604d2b8814968cbc" \
            --title "白饭下载器 0.10.108 · Windows 安装与绿色版（Preview 1）" \
            --prerelease \
            --notes-file preview-assets/RELEASE_NOTES.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
